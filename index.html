<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graduation invitation</title>
    <link rel="icon" media="(prefers-color-scheme: dark)" href="assets/icons/favicon-light.png">
    <link rel="icon" media="(prefers-color-scheme: light)" href="assets/icons/favicon-dark.png">
    
    <!-- font Sacramento -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap" rel="stylesheet">
    
    <!-- font Bodoni Moda -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    
    <!-- font Lora -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="intro">
            <div class="card">
                <div class="icon">
                    <img src="assets/icons/graduation-cap.png" class="icon-cap" alt="">
                </div>
                <div class="text">
                    <h1>You've been invited</h1>
                </div>
            </div>
        </section>
        <section class="invitation">
            <div class="photos">
                <div class="film-strip">
                    
                </div>
            </div>
            <div class="info">
                <div class="year">
                    <div class="year-number">
                        <span class="year-top">20</span>
                        <span class="year-bottom">27</span>
                    </div>
                    <span class="graduate">Graduate</span>

                </div>
                <div class="message">
                    <p>Ngoc Han is graduating</p>
                </div>
                <div class="date">
                    <time class="day" datetime="2027-03-10">10</time>
                    <div class="date-info">
                        <time class="weekday" datetime="2027-03-10">Saturday</time>
                        <time class="month">March</time>
                        <div class="time">
                            <span>AT</span>
                            <time datetime="11:00">11 AM</time>    
                        </div>
                    </div>
                </div>
                <div class="location">
                    <address>
                        HUFLIT Hoc Mon Campus - Ho Chi Minh City
                        <button class="copy-address" type="button" aria-label="Copy address">
                            <img src="assets/icons/copy.png" alt="">
                        </button>
                    </address>

                </div>
                <div class="phone">
                    <span>Reach me at:</span>
                    <a href="tel:0867013939">0867013939</a>
                </div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
